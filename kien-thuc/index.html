<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiến Thức – Shanco Việt Nam</title>
  <meta name="description" content="Chia sẻ kiến thức về thiết kế kiến trúc, BIM, xây dựng xanh và xu hướng hiện đại từ Shanco Việt Nam." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --clr-bg: #0d0f0e;
      --clr-surface: #141716;
      --clr-card: #1a1d1b;
      --clr-border: #2a2f2c;
      --clr-text: #e8ede9;
      --clr-muted: #7a8c7d;
      --clr-accent: #a8c5a0;
      --clr-accent-dark: #6a9b60;
      --clr-white: #f0f5f1;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,15,14,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--clr-border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.3rem; font-weight: 600;
      color: var(--clr-white);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--clr-muted); text-decoration: none;
      font-size: 0.88rem; letter-spacing: 0.06em; text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--clr-accent); }

    /* ── HERO ── */
    .hero {
      padding: 6rem 2rem 4rem;
      max-width: 900px; margin: 0 auto;
      border-bottom: 1px solid var(--clr-border);
    }
    .hero-label {
      font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--clr-accent); margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .hero-label::before {
      content: ''; display: block;
      width: 28px; height: 1px; background: var(--clr-accent);
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 600; line-height: 1.1;
      color: var(--clr-white);
      margin-bottom: 1.2rem;
    }
    .hero p {
      font-size: 1.05rem; color: var(--clr-muted);
      max-width: 560px; line-height: 1.8;
    }

    /* ── FILTER ── */
    .filter-bar {
      max-width: 1100px; margin: 0 auto;
      padding: 2.4rem 2rem 0;
      display: flex; flex-wrap: wrap; gap: 0.6rem;
      align-items: center;
    }
    .filter-label {
      font-size: 0.78rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--clr-muted);
      margin-right: 0.4rem;
    }
    .tag-btn {
      background: transparent;
      border: 1px solid var(--clr-border);
      color: var(--clr-muted);
      padding: 0.35rem 1rem;
      border-radius: 100px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-btn:hover { border-color: var(--clr-accent); color: var(--clr-accent); }
    .tag-btn.active {
      background: var(--clr-accent); border-color: var(--clr-accent);
      color: var(--clr-bg);
    }

    /* ── GRID ── */
    .posts-grid {
      max-width: 1100px; margin: 0 auto;
      padding: 2.4rem 2rem 6rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.6rem;
    }

    /* ── CARD ── */
    .card {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 4px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color 0.25s, transform 0.25s;
      animation: fadeUp 0.5s ease both;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      border-color: var(--clr-accent);
      transform: translateY(-3px);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-img {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; display: block;
      background: var(--clr-surface);
    }
    .card-img-placeholder {
      width: 100%; aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1a2420 0%, #0f1a12 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; color: var(--clr-border);
    }
    .card-body { padding: 1.4rem 1.6rem 1.6rem; flex: 1; display: flex; flex-direction: column; }
    .card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .card-tag {
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--clr-accent-dark);
      background: rgba(106,155,96,0.12);
      padding: 0.2rem 0.6rem; border-radius: 2px;
    }
    .card-title {
      font-family: var(--font-display);
      font-size: 1.35rem; font-weight: 600; line-height: 1.3;
      color: var(--clr-white); margin-bottom: 0.7rem;
    }
    .card-excerpt {
      font-size: 0.88rem; color: var(--clr-muted);
      line-height: 1.7; flex: 1; margin-bottom: 1.2rem;
    }
    .card-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.78rem; color: var(--clr-muted);
      border-top: 1px solid var(--clr-border);
      padding-top: 1rem; margin-top: auto;
    }
    .card-read-more {
      color: var(--clr-accent); font-size: 0.8rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .arrow { display: inline-block; transition: transform 0.2s; }
    .card:hover .arrow { transform: translateX(4px); }

    /* ── EMPTY ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center; padding: 4rem 2rem;
      color: var(--clr-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--clr-border);
      padding: 2rem;
      text-align: center;
      font-size: 0.82rem; color: var(--clr-muted);
    }
    footer a { color: var(--clr-accent); text-decoration: none; }

    @media (max-width: 600px) {
      nav { padding: 0 1rem; }
      .nav-links { gap: 1.2rem; }
      .nav-links li:not(:last-child):not(:nth-last-child(2)) { display: none; }
      .hero { padding: 4rem 1rem 3rem; }
      .filter-bar, .posts-grid { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Shanco Việt Nam</a>
    <ul class="nav-links">
      <li><a href="/#services">Dịch Vụ</a></li>
      <li><a href="/#projects">Dự Án</a></li>
      <li><a href="/kien-thuc/" class="active">Kiến Thức</a></li>
      <li><a href="/#contact">Liên Hệ</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-label">Chia sẻ kiến thức</div>
    <h1>Thiết kế &amp;<br/>Xây dựng</h1>
    <p>Góc nhìn chuyên môn từ đội ngũ Shanco — BIM, kiến trúc xanh, xu hướng hiện đại và những điều cần biết trước khi xây nhà.</p>
  </section>

  <div class="filter-bar">
    <span class="filter-label">Chủ đề:</span>
    <button class="tag-btn active" data-tag="all">Tất cả</button>
    <button class="tag-btn" data-tag="BIM">BIM</button>
    <button class="tag-btn" data-tag="Kiến trúc xanh">Kiến trúc xanh</button>
    <button class="tag-btn" data-tag="Thiết kế">Thiết kế</button>
    <button class="tag-btn" data-tag="Xây dựng">Xây dựng</button>
    <button class="tag-btn" data-tag="Xu hướng">Xu hướng</button>
  </div>

  <div class="posts-grid" id="postsGrid"></div>

  <footer>
    <p>© 2025 Shanco Việt Nam &nbsp;·&nbsp; <a href="mailto:shanco.vn@gmail.com">shanco.vn@gmail.com</a> &nbsp;·&nbsp; <a href="/">Trang chủ</a></p>
  </footer>

  <script>
    // ── Load posts từ posts.json ──
    async function loadPosts() {
      const res = await fetch('/kien-thuc/posts.json');
      const posts = await res.json();
      return posts;
    }

    function renderCards(posts) {
      const grid = document.getElementById('postsGrid');
      grid.innerHTML = '';

      if (posts.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">📐</div><p>Chưa có bài viết trong chủ đề này.</p></div>`;
        return;
      }

      posts.forEach((post, i) => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = post.url;
        card.style.animationDelay = `${i * 0.07}s`;

        const imgHtml = post.thumbnail
          ? `<img class="card-img" src="${post.thumbnail}" alt="${post.title}" loading="lazy" />`
          : `<div class="card-img-placeholder">${post.icon || '🏛️'}</div>`;

        const tagsHtml = post.tags.map(t => `<span class="card-tag">${t}</span>`).join('');

        card.innerHTML = `
          ${imgHtml}
          <div class="card-body">
            <div class="card-tags">${tagsHtml}</div>
            <div class="card-title">${post.title}</div>
            <div class="card-excerpt">${post.excerpt}</div>
            <div class="card-meta">
              <span>${post.date} &nbsp;·&nbsp; ${post.readTime} phút đọc</span>
              <span class="card-read-more">Đọc tiếp <span class="arrow">→</span></span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ── Filter ──
    let allPosts = [];

    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tag = btn.dataset.tag;
        const filtered = tag === 'all'
          ? allPosts
          : allPosts.filter(p => p.tags.includes(tag));
        renderCards(filtered);
      });
    });

    // ── Init ──
    loadPosts().then(posts => {
      allPosts = posts;
      renderCards(posts);
    }).catch(() => {
      document.getElementById('postsGrid').innerHTML =
        `<div class="empty-state"><div class="icon">⚠️</div><p>Không tải được danh sách bài viết.</p></div>`;
    });
  </script>
</body>
</html>
